name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python 语法检查
        run: |
          python -m py_compile relay/workbuddy-openai-relay.py
          python -m py_compile ui/wb_bridge_ui.py

      - name: PowerShell 语法检查
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $e = $null; $t = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$t, [ref]$e)
            if ($e.Count -gt 0) { $errors += "$($_.Name): $($e[0].Message)" }
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Write-Host "所有 .ps1 语法通过"

      - name: 配置模板可解析
        shell: pwsh
        run: |
          $s = Import-PowerShellDataFile config/settings.example.psd1
          if (-not $s.ContainsKey('CodebuddyCli')) { throw "settings.example.psd1 缺少 CodebuddyCli" }
          Write-Host "settings.example.psd1 解析通过"

      - name: 敏感信息扫描（防 token / 私钥误提交）
        shell: pwsh
        run: |
          # 特征串拆开拼接：否则扫描器会把自己的规则字符串当成命中
          $patterns = @(
            ('eyJhbGci' + 'OiJSUzI1NiIs'),
            ('BEGIN OPENSSH ' + 'PRIVATE KEY'),
            ('BEGIN RSA ' + 'PRIVATE KEY')
          )
          $hits = @()
          Get-ChildItem -Recurse -File -Include *.md,*.ps1,*.py,*.yml,*.yaml,*.psd1,*.cmd |
            Where-Object { $_.FullName -notmatch '\\\.git\\|\\\.github\\' } |
            ForEach-Object {
              $f = $_
              foreach ($p in $patterns) {
                if (Select-String -Path $f.FullName -Pattern $p -SimpleMatch -ErrorAction SilentlyContinue) {
                  $hits += "$($f.Name): 命中凭据特征"
                }
              }
            }
          if ($hits.Count -gt 0) {
            $hits | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Write-Host "未发现凭据特征"

      - name: 确认本机配置未被追踪
        shell: pwsh
        run: |
          $bad = 0
          foreach ($p in @('config/settings.psd1', 'config/cordis.patch.current.yml')) {
            git ls-files --error-unmatch $p 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "::error::$p 被纳入版本控制，请检查 .gitignore"
              $bad++
            }
          }
          if ($bad -gt 0) { exit 1 }
          Write-Host "本机配置均未被追踪"
